<div class="container">

    <h1 class="text-center mb-4">JavaScript Tasks</h1>

    <!-- Task 1 -->
    <div class="task-box">
        <h3>Task 1: Even or Odd Checker</h3>

        <input type="number" id="eo-input" class="form-control"
               placeholder="Enter a number">

        <br>

        <button class="btn btn-primary"
                onclick="checkEvenOdd()">
            Check
        </button>

        <div class="output" id="eo-output"></div>
    </div>

    <!-- Task 2 -->
    <div class="task-box">
        <h3>Task 2: Multiplication Table</h3>

        <input type="number" id="mt-input"
               class="form-control"
               placeholder="Enter a number">

        <br>

        <button class="btn btn-primary"
                onclick="generateTable()">
            Generate
        </button>

        <div class="output" id="mt-output"></div>
    </div>

    <!-- Task 3 -->
    <div class="task-box">
        <h3>Task 3: FizzBuzz</h3>

        <button class="btn btn-primary"
                onclick="runFizzBuzz()">
            Run FizzBuzz
        </button>

        <div class="output" id="fb-output"></div>
    </div>

    <!-- Task 4 -->
    <div class="task-box">
        <h3>Task 4: Square Pattern</h3>

        <input type="number"
               id="sq-input"
               class="form-control"
               placeholder="Enter n">

        <br>

        <button class="btn btn-primary"
                onclick="drawSquare()">
            Draw
        </button>

        <div class="output" id="sq-output"></div>
    </div>

    <!-- Task 5 -->
    <div class="task-box">
        <h3>Task 5: Right-Angled Triangle</h3>

        <input type="number"
               id="tri-input"
               class="form-control"
               placeholder="Enter n">

        <br>

        <button class="btn btn-primary"
                onclick="drawTriangle()">
            Draw
        </button>

        <div class="output" id="tri-output"></div>
    </div>

    <!-- Task 6 -->
    <div class="task-box">
        <h3>Task 6: Dynamic Color Changer</h3>

        <div id="color-display"></div>

        <input type="color"
               id="color-picker"
               value="#ffb6c1">

        <span id="color-hex">#ffb6c1</span>

        <button class="btn btn-secondary"
                onclick="resetColor()">
            Reset
        </button>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript -->
<script>

  //Task 1 Even or Odd Checker
function checkEvenOdd() {
    const num = parseInt(document.getElementById("eo-input").value);

    if (isNaN(num)) {
        document.getElementById("eo-output").textContent =
            "Please enter a valid number.";
        return;
    }

    document.getElementById("eo-output").textContent =
        (num % 2 === 0)
        ? num + " is an even number."
        : num + " is an odd number.";
}

//Task 2 Multiplication Table Generator (Using Loops)
function generateTable() {
    const num = parseInt(document.getElementById("mt-input").value);

    if (isNaN(num)) {
        document.getElementById("mt-output").textContent =
            "Please enter a valid number.";
        return;
    }

    let result = "";

    for (let i = 1; i <= 10; i++) {
        result += `${num} × ${i} = ${num * i}\n`;
    }

    document.getElementById("mt-output").textContent = result;
}

// Task 3 FizzBuzz Challenge
function runFizzBuzz() {
    let result = "";

    for (let i = 1; i <= 20; i++) {
        if (i % 15 === 0) {
            result += "FizzBuzz\n";
        } else if (i % 3 === 0) {
            result += "Fizz\n";
        } else if (i % 5 === 0) {
            result += "Buzz\n";
        } else {
            result += i + "\n";
        }
    }

    document.getElementById("fb-output").textContent = result;
}

// Task 4 Square Pattern
function drawSquare() {
    const n = parseInt(document.getElementById("sq-input").value);

    if (isNaN(n) || n <= 0) {
        document.getElementById("sq-output").textContent =
            "Enter a positive number.";
        return;
    }

    let result = "";

    for (let i = 0; i < n; i++) {
        result += "*".repeat(n) + "\n";
    }

    document.getElementById("sq-output").textContent = result;
}

// Task 5 Right-Angled Triangle
function drawTriangle() {
    const n = parseInt(document.getElementById("tri-input").value);

    if (isNaN(n) || n <= 0) {
        document.getElementById("tri-output").textContent =
            "Enter a positive number.";
        return;
    }

    let result = "";

    for (let i = 1; i <= n; i++) {
        result += "*".repeat(i) + "\n";
    }

    document.getElementById("tri-output").textContent = result;
}

//Tsk 6 Right-Angled Triangle
const DEFAULT_COLOR = "pink";

const colorPicker = document.getElementById("color-picker");
const colorDisplay = document.getElementById("color-display");
const colorHex = document.getElementById("color-hex");

colorPicker.addEventListener("input", function () {
    colorDisplay.style.backgroundColor = this.value;
    colorHex.textContent = this.value;
});

function resetColor() {
    colorDisplay.style.backgroundColor = DEFAULT_COLOR;
    colorPicker.value = DEFAULT_COLOR;
    colorHex.textContent = DEFAULT_COLOR;
}
</script>
