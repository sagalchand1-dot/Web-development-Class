<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Hello, world!</title>
  </head>

  <body>
    <h1 style="color:pink;">Hello, world!</h1>

    <div class="container">
      <div class="row">

        <div class="mb-3 col-lg-3 col-md-6 col-sm-12"
          style="font-size:20px; font-family:'Courier New', Courier, monospace; color:pink;">

          <label for="exampleFormControlInput1" class="form-label">
            Username
          </label>

          <input
            type="email"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder="Username"
          />
        </div>

        <div class="mb-3 col-lg-3 col-md-6 col-sm-12"
          style="font-size:20px; font-family:'Courier New', Courier, monospace; color:pink;">

          <label for="exampleFormControlInput1" class="form-label">
            Email address
          </label>

          <input
            type="email"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder="name@example.com"
          />
        </div>

        <div class="mb-3 col-lg-3 col-md-6 col-sm-12"
          style="font-size:20px; font-family:'Courier New', Courier, monospace; color:pink;">

          <label for="exampleFormControlInput1" class="form-label">
            Password
          </label>

          <input
            type="password"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder="password"
          />
        </div>

        <div class="mb-3 col-lg-3 col-md-6 col-sm-12"
          style="font-size:20px; font-family:'Courier New', Courier, monospace; color:pink;">

          <label for="exampleFormControlTextarea1" class="form-label">
            Example textarea
          </label>

          <textarea
            class="form-control"
            id="exampleFormControlTextarea1"
            rows="3">
          </textarea>

        </div>
      </div>
    </div>

  </body>
</html>
